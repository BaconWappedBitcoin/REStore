<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>REStore options</title>
    <style>
      body { font-family: -apple-system, "Segoe UI", Verdana, sans-serif; max-width: 640px; margin: 40px auto; color: #1a1a1b; }
      h1 { font-size: 20px; } h1 span { color: #ff4500; } h2 { font-size: 16px; margin-top: 28px; color: #369; }

    <h1><span>RE</span>Store options</h1>
